name: app-build-action
#推送Tag时触发
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  # 打包Android
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # APK签名设置（Fork 环境不依赖 Secrets，生成一次性 CI 签名用于打包）
      - name: Create Android signing config
        run: |
          keytool -genkeypair -v \
            -keystore simple_live_app/android/app/ci-release-keystore.jks \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias android \
            -dname "CN=CI,O=Fork,C=US"
          echo "storeFile=$GITHUB_WORKSPACE/simple_live_app/android/app/ci-release-keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=android" >> simple_live_app/android/key.properties
          echo "keyPassword=android" >> simple_live_app/android/key.properties
          echo "keyAlias=android" >> simple_live_app/android/key.properties

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 打包APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 给APK文件名加上pubspec.yaml中的version字段
      - name: Add pubspec version to APK filenames
        shell: bash
        run: |
          app_version="${{ steps.version.outputs.VERSION }}"

          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(dirname "$file")
            name=$(basename "$file")
            base="${name%.*}"
            ext="${name##*.}"
            if [[ "$base" == *"$app_version"* ]]; then
              echo "Skip $file (already contains version)"
              continue
            fi
            target="$dir/${base}-${app_version}.${ext}"
            echo "Rename $file -> $target"
            mv "$file" "$target"
          done < <(find simple_live_app/build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No APK files found" >&2
            exit 1
          fi

      # 上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          files: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk

      # 完成
      - run: echo "🤖 Android job's status is ${{ job.status }}."

  # 打包iOS
  build-ios:
    # https://github.com/actions/runner-images/issues/12541
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r simple_live_app.ipa Payload
          cd ../../..

      # 给IPA文件名加上pubspec.yaml中的version字段
      - name: Add pubspec version to IPA filenames
        shell: bash
        run: |
          app_version="${{ steps.version.outputs.VERSION }}"

          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(dirname "$file")
            name=$(basename "$file")
            base="${name%.*}"
            ext="${name##*.}"
            if [[ "$base" == *"$app_version"* ]]; then
              echo "Skip $file (already contains version)"
              continue
            fi
            target="$dir/${base}-${app_version}.${ext}"
            echo "Rename $file -> $target"
            mv "$file" "$target"
          done < <(find simple_live_app/build/ios/iphoneos -maxdepth 1 -type f -name '*.ipa' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No IPA files found" >&2
            exit 1
          fi

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/*.ipa

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          files: |
            simple_live_app/build/ios/iphoneos/*.ipa

      # 完成
      - run: echo "🍏 iOS job's status is ${{ job.status }}."

  # 打包MacOS
  build-macos:
    # https://github.com/actions/runner-images/issues/12541
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # 打包MacOS
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 给MacOS打包文件名加上pubspec.yaml中的version字段
      - name: Add pubspec version to MacOS package filenames
        shell: bash
        run: |
          app_version="${{ steps.version.outputs.VERSION }}"

          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(dirname "$file")
            name=$(basename "$file")
            base="${name%.*}"
            ext="${name##*.}"
            if [[ "$base" == *"$app_version"* ]]; then
              echo "Skip $file (already contains version)"
              continue
            fi
            target="$dir/${base}-${app_version}.${ext}"
            echo "Rename $file -> $target"
            mv "$file" "$target"
          done < <(find simple_live_app/build/dist -type f \( -name '*.dmg' -o -name '*.zip' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "No MacOS package files found" >&2
            exit 1
          fi

      # 上传MacOS至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 完成
      - run: echo "🍏 MacOS job's status is ${{ job.status }}."

  # 打包Linux
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Linux ZIP\DMG
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      # 给Linux打包文件名加上pubspec.yaml中的version字段
      - name: Add pubspec version to Linux package filenames
        shell: bash
        run: |
          app_version="${{ steps.version.outputs.VERSION }}"

          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(dirname "$file")
            name=$(basename "$file")
            base="${name%.*}"
            ext="${name##*.}"
            if [[ "$base" == *"$app_version"* ]]; then
              echo "Skip $file (already contains version)"
              continue
            fi
            target="$dir/${base}-${app_version}.${ext}"
            echo "Rename $file -> $target"
            mv "$file" "$target"
          done < <(find simple_live_app/build/dist -type f \( -name '*.deb' -o -name '*.zip' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "No Linux package files found" >&2
            exit 1
          fi
      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          files: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip
        #完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      # 给Windows打包文件名加上pubspec.yaml中的version字段
      - name: Add pubspec version to Windows package filenames
        shell: bash
        run: |
          app_version="${{ steps.version.outputs.VERSION }}"

          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(dirname "$file")
            name=$(basename "$file")
            base="${name%.*}"
            ext="${name##*.}"
            if [[ "$base" == *"$app_version"* ]]; then
              echo "Skip $file (already contains version)"
              continue
            fi
            target="$dir/${base}-${app_version}.${ext}"
            echo "Rename $file -> $target"
            mv "$file" "$target"
          done < <(find simple_live_app/build/dist -type f \( -name '*.msix' -o -name '*.zip' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "No Windows package files found" >&2
            exit 1
          fi

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          files: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."
