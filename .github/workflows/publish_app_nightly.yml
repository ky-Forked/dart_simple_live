name: app-nightly-build-action
# 每天北京时间 02:00 触发（GitHub Actions cron 使用 UTC，即前一天 18:00 UTC）
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
jobs:
  # 打包Android
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # APK签名设置（Fork 环境不依赖 Secrets，生成一次性 CI 签名用于打包）
      - name: Create Android signing config
        run: |
          keytool -genkeypair -v \
            -keystore simple_live_app/android/app/ci-release-keystore.jks \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias android \
            -dname "CN=CI,O=Fork,C=US"
          echo "storeFile=$GITHUB_WORKSPACE/simple_live_app/android/app/ci-release-keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=android" >> simple_live_app/android/key.properties
          echo "keyPassword=android" >> simple_live_app/android/key.properties
          echo "keyAlias=android" >> simple_live_app/android/key.properties

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 打包APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 将APK文件名改为固定名称
      - name: Rename APK files
        shell: bash
        run: |
          cd simple_live_app/build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk simple-live-android-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk simple-live-android-arm64-v8a.apk
          mv app-x86_64-release.apk simple-live-android-x86_64.apk

      # 上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "nightly"
          name: "nightly build"
          generate_release_notes: true
          overwrite: true
          prerelease: true
          files: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk

      # 完成
      - run: echo "🤖 Android job's status is ${{ job.status }}."

  # 打包iOS
  build-ios:
    # https://github.com/actions/runner-images/issues/12541
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r simple_live_app.ipa Payload
          cd ../../..

      # 将IPA文件名改为固定名称
      - name: Rename IPA file
        shell: bash
        run: |
          mv simple_live_app/build/ios/iphoneos/simple_live_app.ipa simple_live_app/build/ios/iphoneos/simple-live-ios.ipa

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/*.ipa

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "nightly"
          name: "nightly build"
          generate_release_notes: true
          overwrite: true
          prerelease: true
          files: |
            simple_live_app/build/ios/iphoneos/*.ipa

      # 完成
      - run: echo "🍏 iOS job's status is ${{ job.status }}."

  # 打包MacOS
  build-macos:
    # https://github.com/actions/runner-images/issues/12541
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # 打包MacOS
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 将MacOS打包文件名改为固定名称
      - name: Rename MacOS package files
        shell: bash
        run: |
          rename_single_file() {
            pattern="$1"
            fixed_name="$2"
            found=0
            first_file=""

            while IFS= read -r -d '' file; do
              found=$((found + 1))
              first_file="$file"
            done < <(find simple_live_app/build/dist -type f -name "$pattern" -print0)

            if [ "$found" -eq 0 ]; then
              echo "No $pattern files found" >&2
              exit 1
            fi

            if [ "$found" -gt 1 ]; then
              echo "Multiple $pattern files found, cannot rename to a single fixed filename:" >&2
              find simple_live_app/build/dist -type f -name "$pattern" >&2
              exit 1
            fi

            target="$(dirname "$first_file")/$fixed_name"
            echo "Rename $first_file -> $target"
            mv "$first_file" "$target"
          }

          rename_single_file "*.dmg" "simple-live-macos.dmg"
          rename_single_file "*.zip" "simple-live-macos.zip"

      # 上传MacOS至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "nightly"
          name: "nightly build"
          generate_release_notes: true
          overwrite: true
          prerelease: true
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 完成
      - run: echo "🍏 MacOS job's status is ${{ job.status }}."

  # 打包Linux
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Linux ZIP\DMG
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      # 将Linux打包文件名改为固定名称
      - name: Rename Linux package files
        shell: bash
        run: |
          rename_single_file() {
            pattern="$1"
            fixed_name="$2"
            found=0
            first_file=""

            while IFS= read -r -d '' file; do
              found=$((found + 1))
              first_file="$file"
            done < <(find simple_live_app/build/dist -type f -name "$pattern" -print0)

            if [ "$found" -eq 0 ]; then
              echo "No $pattern files found" >&2
              exit 1
            fi

            if [ "$found" -gt 1 ]; then
              echo "Multiple $pattern files found, cannot rename to a single fixed filename:" >&2
              find simple_live_app/build/dist -type f -name "$pattern" >&2
              exit 1
            fi

            target="$(dirname "$first_file")/$fixed_name"
            echo "Rename $first_file -> $target"
            mv "$first_file" "$target"
          }

          rename_single_file "*.deb" "simple-live-linux.deb"
          rename_single_file "*.zip" "simple-live-linux.zip"
      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "nightly"
          name: "nightly build"
          generate_release_notes: true
          overwrite: true
          prerelease: true
          files: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip
        #完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 获取版本信息（从 pubspec.yaml 提取）
      - name: Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          app_version=$(awk '/^version:[[:space:]]*/ { print $2; exit }' simple_live_app/pubspec.yaml)
          if [ -z "$app_version" ]; then
            echo "Failed to read version from simple_live_app/pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_OUTPUT"
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      # 将Windows打包文件名改为固定名称
      - name: Rename Windows package files
        shell: bash
        run: |
          rename_single_file() {
            pattern="$1"
            fixed_name="$2"
            found=0
            first_file=""

            while IFS= read -r -d '' file; do
              found=$((found + 1))
              first_file="$file"
            done < <(find simple_live_app/build/dist -type f -name "$pattern" -print0)

            if [ "$found" -eq 0 ]; then
              echo "No $pattern files found" >&2
              exit 1
            fi

            if [ "$found" -gt 1 ]; then
              echo "Multiple $pattern files found, cannot rename to a single fixed filename:" >&2
              find simple_live_app/build/dist -type f -name "$pattern" >&2
              exit 1
            fi

            target="$(dirname "$first_file")/$fixed_name"
            echo "Rename $first_file -> $target"
            mv "$first_file" "$target"
          }

          rename_single_file "*.msix" "simple-live-windows.msix"
          rename_single_file "*.zip" "simple-live-windows.zip"

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "nightly"
          name: "nightly build"
          generate_release_notes: true
          overwrite: true
          prerelease: true
          files: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."
